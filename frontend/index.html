<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL-X | Supervision</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#f8fafc; --mut:#94a3b8;
                --ok:#059669; --warn:#d97706; --bad:#e11d48; --acc:#38bdf8; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 16px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        header h1 { margin: 0; font-size: 1.4rem; letter-spacing: 2px; color: var(--acc); }

        /* Bandeau "retour ESP8266" toujours visible */
        .esp { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; flex-wrap: wrap; }
        .oled { background: #000; border: 2px solid #475569; border-radius: 6px; padding: 6px 12px; font-family: 'Courier New', monospace; min-width: 230px; }
        .oled .l1 { font-weight: bold; letter-spacing: 1px; }
        .oled .l2 { font-size: .85rem; color: var(--mut); }

        nav { display: flex; gap: 6px; margin-bottom: 14px; }
        nav button { background: var(--card); color: var(--mut); border: 0; border-radius: 8px 8px 0 0; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
        nav button.active { color: var(--txt); box-shadow: inset 0 -3px 0 var(--acc); }
        .tab { display: none; } .tab.active { display: block; }

        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
        .tile { background: var(--card); border-radius: 10px; padding: 12px 14px; }
        .tile .k { color: var(--mut); font-size: .8rem; margin-bottom: 6px; }
        .badge { display: inline-block; font-weight: bold; padding: 4px 10px; border-radius: 5px; background: #475569; color: #fff; }
        .ok { background: var(--ok); } .warn { background: var(--warn); } .bad { background: var(--bad); } .off { background: #475569; }

        .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
        .card { background: var(--card); border-radius: 10px; padding: 14px 16px; }
        .card h2 { margin: 0 0 8px; font-size: 1rem; color: var(--mut); font-weight: 600; }
        .chart-box { position: relative; height: 240px; }

        /* Onglet caméra */
        .cam-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .cam-view { position: relative; background: #000; border-radius: 10px; aspect-ratio: 3 / 2; max-width: 720px; margin: 0 auto; overflow: hidden; }
        .cam-view img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .cam-view.live img { display: block; }
        .cam-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--mut); text-align: center; padding: 20px; gap: 6px; }
        .cam-view.live .cam-overlay { display: none; }
        .cam-overlay .big { font-size: 1.3rem; color: var(--txt); }
        .btn { background: var(--acc); color: #04293a; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: default; }
        .btn.sec { background: var(--line); color: var(--txt); }
        .ident { margin: 14px auto 0; max-width: 720px; }

        table.events { width: 100%; border-collapse: collapse; font-size: .9rem; }
        table.events td, table.events th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
        .ack-btn { background: var(--line); color: var(--txt); border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
        .INFO { background: var(--ok); } .WARNING { background: var(--warn); } .CRITICAL { background: var(--bad); }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>SENTINEL-X</h1>
        <span id="liaison" class="badge off">Backend : connexion…</span>
    </header>

    <!-- Ce que fait l'ESP8266 en ce moment (écran, buzzer) -->
    <div class="esp">
        <div class="oled"><div class="l1" id="oled-l1">SENTINEL-X</div><div class="l2" id="oled-l2">Surveillance OK</div></div>
        <span id="buzzer-etat" class="badge ok">SILENCIEUX</span>
        <span id="scenarios-actifs" class="badge off">IDLE</span>
    </div>

    <nav>
        <button data-tab="capteurs" class="active">Capteurs</button>
        <button data-tab="camera">Caméra</button>
        <button data-tab="evenements">Événements</button>
    </nav>

    <!-- ===== Capteurs ===== -->
    <section id="tab-capteurs" class="tab active">
        <div class="tiles">
            <div class="tile"><div class="k">Détecteur de présence</div><span id="status-pir" class="badge off">—</span></div>
            <div class="tile"><div class="k">Gaz / fumée</div><span id="status-gas" class="badge off">—</span></div>
            <div class="tile"><div class="k">Analyse IA environnement</div><span id="env-ia" class="badge off">—</span></div>
            <div class="tile"><div class="k">Dernier badge RFID</div><span id="status-rfid" class="badge off">AUCUN</span></div>
        </div>
        <div class="grid2">
            <div class="card"><h2>Température et humidité</h2><div class="chart-box"><canvas id="envChart"></canvas></div></div>
            <div class="card"><h2>Gaz / fumée</h2><div class="chart-box"><canvas id="gasChart"></canvas></div></div>
        </div>
    </section>

    <!-- ===== Caméra ===== -->
    <section id="tab-camera" class="tab">
        <div class="card">
            <div class="cam-top">
                <span id="cam-badge" class="badge off">—</span>
                <button id="cam-btn" class="btn" disabled>Activer la caméra</button>
                <span id="cam-msg" style="color: var(--mut)"></span>
            </div>
            <div id="cam-view" class="cam-view">
                <img id="cam-img" alt="Flux de la caméra">
                <div class="cam-overlay"><div class="big" id="cam-over-t">Caméra éteinte</div><div id="cam-over-s">Aucune présence détectée</div></div>
            </div>
            <div class="ident" id="cam-ident"></div>
        </div>
    </section>

    <!-- ===== Événements ===== -->
    <section id="tab-evenements" class="tab">
        <div class="card">
            <h2>Journal des événements</h2>
            <table class="events">
                <thead><tr><th>Heure</th><th>Scénario</th><th>Détail</th><th></th></tr></thead>
                <tbody id="events-body"></tbody>
            </table>
        </div>
    </section>
</div>
<script src="app.js"></script>
</body>
</html>
